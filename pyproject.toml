[project]
name = "ai-mlops-hands-on-exercise"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.30",
]

# Charts and tests are development tools: `uv sync` installs them by default,
# while the API image uses `uv sync --no-dev` and stays smaller.
[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.2.0",
    "seaborn>=0.13.2",
]
