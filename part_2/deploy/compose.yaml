name: census-income-explorer

# Three services, one direction of data flow:
#   pipeline (one-shot) -> named volume -> api -> web
# No database: the artefacts are 5.7 MB / 9.5 MB CSVs and a cached aggregate
# answers in ~2 ms (24 ms for the uncached audit in reports/task2.md).

services:
  pipeline:
    build:
      context: ../..
      dockerfile: part_2/deploy/Dockerfile.api
    image: census-explorer-api:local
    command: ["sh", "/app/part_2/deploy/build_artifacts.sh"]
    # Starts as root only to chown the fresh volume, then drops to uid 10001
    # inside the script (see build_artifacts.sh).
    user: "0:0"
    environment:
      ARTIFACT_DIR: /data/artifacts
      CENSUS_RAW_PATH: /data/raw/census_income.csv
      CENSUS_ENCODED_PATH: /data/artifacts/census_income_final.csv
    volumes:
      - ../../part_1/data/raw_data:/data/raw:ro
      - ../../datasets:/data/datasets:ro
      - artifacts:/data/artifacts
    restart: "no"

  api:
    image: census-explorer-api:local
    environment:
      CENSUS_RAW_PATH: /data/raw/census_income.csv
      CENSUS_ENCODED_PATH: /data/artifacts/census_income_final.csv
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ../../part_1/data/raw_data:/data/raw:ro
      - ../../datasets:/data/datasets:ro
      - artifacts:/data/artifacts:ro
    depends_on:
      pipeline:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    ports:
      # Bound to localhost: the only intended client is the nginx container.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: part_2/deploy/Dockerfile.web
    image: census-explorer-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  artifacts:
